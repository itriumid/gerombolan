[package]
name = "gerombolan"
version = "0.1.0"
description = "You've seen the advertisements. Now play the game, without them."
authors = ["Itrium"]
edition = "2024"
license = "MIT"
publish = false

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's, which Windows needs:
# https://github.com/rust-lang/cargo/issues/8519
name = "gerombolan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
